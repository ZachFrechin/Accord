# Pipeline de release du client de bureau.
#
# Tag `vX.Y.Z` → build macOS et Windows sur les runners hébergés par GitHub, puis
# une release portant les installeurs et `latest.json`, le manifeste que
# l'updater interroge.
#
# Les runners sont ceux de GitHub, pas les nôtres : sur un dépôt public ils sont
# gratuits et sans limite de minutes, et ils fournissent un Windows — ce que le
# pipeline GitLab d'origine ne pouvait obtenir qu'avec une machine à demeure.
#
# L'updater vise https://github.com/ZachFrechin/Accord/releases/latest/download/latest.json
# que GitHub redirige vers la release la plus récente : l'URL ne changera plus.
#
# Linux n'est pas construit : le client n'y a jamais été testé. Le job de
# publication tolère l'absence d'une plateforme, l'ajouter ne demandera qu'une
# ligne de plus dans la matrice.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Rejouer une release sans re-tagger, quand seul le pipeline a échoué.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v0.15.0)"
        required: true

permissions:
  contents: write # créer la release et y attacher les fichiers

env:
  DESKTOP_DIR: apps/desktop

jobs:
  build:
    strategy:
      # Une plateforme en échec ne doit pas emporter l'autre : mieux vaut
      # publier un installeur que zéro.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            name: macos
          - platform: windows-latest
            args: --bundles msi,nsis
            name: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Le runner macOS est en arm64 : la cible Intel doit être ajoutée pour que
      # le binaire universel puisse être assemblé.
      - name: Cibles Rust (macOS universel)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Sans cache, chaque release recompile OpenMLS et Tauri depuis zéro.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Version et notes de version
        shell: bash
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd "$DESKTOP_DIR"
          npm ci
          # Refuse de construire si le changelog n'a pas d'entrée pour cette
          # version : les notes en sont tirées, et une release muette n'a aucun
          # intérêt pour qui la reçoit.
          node scripts/ci-set-version.mjs "${TAG#v}"

      - name: Build
        shell: bash
        env:
          # La clé de signature de l'updater. Sans elle, Tauri produit un
          # installeur qui s'installe très bien puis ne peut plus jamais se
          # mettre à jour — panne découverte des semaines plus tard, par des
          # utilisateurs déjà coincés. On échoue donc franchement ici.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARGS: ${{ matrix.args }}
        run: |
          set -eu
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "secret TAURI_SIGNING_PRIVATE_KEY absent — la build ne serait pas mettable à jour" >&2
            exit 1
          fi
          cd "$DESKTOP_DIR"
          npm run tauri build -- $ARGS

      - name: Rassembler les artefacts
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          # Les chemins diffèrent (cible universelle côté macOS, native côté
          # Windows) : on ratisse l'arbre des bundles plutôt que de coder deux
          # arborescences en dur.
          find "$DESKTOP_DIR/src-tauri/target" -path '*/release/bundle/*' \
               \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
                  -o -name '*.msi' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) \
               -exec cp {} dist/ \;
          ls -l dist
          [ -n "$(ls -A dist)" ] || { echo "aucun artefact produit" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          retention-days: 7

  publish:
    needs: build
    # `always()` : une plateforme en échec ne doit pas empêcher de publier
    # l'autre. Le manifeste omet simplement la plateforme absente.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Manifeste de mise à jour et publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"

          # Les notes viennent du changelog affiché dans l'application : une
          # seule source, donc la page de release et l'app ne peuvent pas
          # raconter deux histoires différentes.
          NOTES="$(node "$DESKTOP_DIR/scripts/release-notes.mjs" "$VERSION")" \
            || NOTES="Accord desktop $TAG"

          cd artifacts
          ls -l
          platforms='{}'
          mac_tar="$(find . -name '*.app.tar.gz' -print -quit | sed 's|^\./||')"
          win_exe="$(find . -name '*-setup.exe' -print -quit | sed 's|^\./||')"

          # Une plateforme n'entre au manifeste qu'AVEC sa signature : une entrée
          # sans signature fait rejeter le téléchargement à l'installation, ce
          # qui ressemble à une application cassée plutôt qu'à une signature
          # manquante.
          if [ -n "$mac_tar" ] && [ -f "$mac_tar.sig" ]; then
            platforms="$(jq -c --arg url "$BASE/$mac_tar" --arg sig "$(cat "$mac_tar.sig")" \
              '. + {"darwin-universal": {url: $url, signature: $sig}}' <<<"$platforms")"
          fi
          if [ -n "$win_exe" ] && [ -f "$win_exe.sig" ]; then
            platforms="$(jq -c --arg url "$BASE/$win_exe" --arg sig "$(cat "$win_exe.sig")" \
              '. + {"windows-x86_64": {url: $url, signature: $sig}}' <<<"$platforms")"
          fi

          if [ "$(jq 'length' <<<"$platforms")" -gt 0 ]; then
            jq -n --arg version "$VERSION" --arg notes "$NOTES" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson platforms "$platforms" \
              '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
              > latest.json
            echo "manifeste : $(jq -r '.platforms | keys | join(", ")' latest.json)"
          else
            echo "ATTENTION : aucun artefact signé — publication des installeurs seuls."
            echo "Les clients déjà installés ne verront PAS cette version."
          fi

          # Les .sig sont des entrées de build, pas des téléchargements : leur
          # contenu est déjà dans latest.json.
          rm -f ./*.sig

          NOTES_FULL="$(printf 'Accord desktop %s.\n\n%s\n\nTéléchargez un installeur ci-dessous. Au premier lancement, Accord vous demandera l'"'"'adresse de votre serveur.' "$TAG" "$NOTES")"
          # Rejouer une release ne doit pas échouer sur « existe déjà » : quand
          # une seule plateforme a fauté, on veut compléter la release en place,
          # pas la recréer. --clobber remplace aussi latest.json, qui doit
          # refléter TOUTES les plateformes finalement construites.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES_FULL"
            gh release upload "$TAG" --repo "$REPO" --clobber ./*
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Accord $TAG" \
              --notes "$NOTES_FULL" \
              ./*
          fi
