# Desktop release pipeline.
#
# Tag `vX.Y.Z` → build on the self-hosted macOS and Windows machines, then
# publish one GitHub Release carrying every installer plus `latest.json`, the
# manifest the in-app updater polls.
#
# The updater endpoint baked into the app is
#   https://github.com/ZachFrechin/Accord/releases/latest/download/latest.json
# which GitHub redirects to the newest release's asset — so the URL never has to
# change again.
#
# Linux is not built here: it needs a Docker runner, and none is registered. The
# GitLab pipeline had the same gap; adding a `ubuntu-latest` job later is
# straightforward, the release job already tolerates missing platforms.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # required to create the release and upload assets

env:
  DESKTOP_DIR: apps/desktop

jobs:
  # ---------------------------------------------------------------------------
  # macOS — universal .dmg + the signed updater tarball.
  # ---------------------------------------------------------------------------
  macos:
    runs-on: [self-hosted, macos-local]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # A Tauri signing key is ONE base64 line that decodes to an
          # rsign/minisign secret key. The runner's key FILE wins when present —
          # it is always exact, where a hand-pasted secret can pick up stray
          # whitespace. Never build unsigned artifacts silently: an unsigned
          # build installs fine and then can never update itself, which is
          # discovered weeks later by users who are already stuck.
          set -eu
          keyfile="$HOME/.tauri/accord2-updater.key"
          squash() { printf '%s' "$1" | tr -d ' \t\r\n'; }
          if [ -f "$keyfile" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=$keyfile" >> "$GITHUB_ENV"
            echo "signing key: runner file"
          elif [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            cleaned="$(squash "$TAURI_SIGNING_PRIVATE_KEY")"
            if printf '%s' "$cleaned" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
              echo "TAURI_SIGNING_PRIVATE_KEY contains non-base64 characters — paste the ONE-LINE content of ~/.tauri/accord2-updater.key exactly" >&2
              exit 1
            fi
            # NO trailing newline: Tauri base64-decodes the whole file and a
            # final \n breaks it with "Invalid symbol 10".
            tmp="$(mktemp)"
            printf '%s' "$cleaned" > "$tmp"
            echo "TAURI_SIGNING_PRIVATE_KEY=$tmp" >> "$GITHUB_ENV"
            echo "signing key: repository secret ($(printf '%s' "$cleaned" | wc -c | tr -d ' ') base64 chars)"
          else
            echo "missing updater signing key: no $keyfile and no TAURI_SIGNING_PRIVATE_KEY secret" >&2
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cd "$DESKTOP_DIR"
          npm ci
          # Refuses to build when the changelog has no entry for this version —
          # the release notes come from it, so a missing entry means a release
          # with nothing to say.
          node scripts/ci-set-version.mjs "${GITHUB_REF_NAME#v}"
          npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Collect the artifacts
        shell: bash
        run: |
          set -eu
          root="$DESKTOP_DIR/src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p dist
          dmg="$(find "$root/dmg" -name '*.dmg' | head -1)"
          tarball="$(find "$root/macos" -name '*.app.tar.gz' | head -1)"
          sig="$(find "$root/macos" -name '*.app.tar.gz.sig' | head -1)"
          [ -n "$dmg" ] || { echo "missing the macOS .dmg" >&2; exit 1; }
          [ -n "$tarball" ] && [ -n "$sig" ] || { echo "missing the signed updater artifact" >&2; exit 1; }
          cp "$dmg" "$tarball" "$sig" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows — .msi + .exe, the .exe doubling as the updater payload.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: [self-hosted, windows-local]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          # This machine has no key file, so the secret is the only source. It
          # must be the one-line base64 private key, written WITHOUT a trailing
          # newline — Tauri decodes the whole file and a stray \n breaks it.
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "missing TAURI_SIGNING_PRIVATE_KEY secret — Windows cannot produce an updatable build"
          }
          $cleaned = ($env:TAURI_SIGNING_PRIVATE_KEY -replace '\s', '')
          $tmp = [System.IO.Path]::GetTempFileName()
          [System.IO.File]::WriteAllText($tmp, $cleaned)
          $env:TAURI_SIGNING_PRIVATE_KEY = $tmp

          Set-Location $env:DESKTOP_DIR
          npm ci
          node scripts/ci-set-version.mjs $($env:GITHUB_REF_NAME -replace '^v', '')
          npm run tauri build -- --bundles msi,nsis

      - name: Collect the artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:DESKTOP_DIR\src-tauri\target\release\bundle"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $wanted = @(
            (Get-ChildItem "$root\msi"  -Filter *.msi     -ErrorAction SilentlyContinue | Select-Object -First 1),
            (Get-ChildItem "$root\nsis" -Filter *.exe     -ErrorAction SilentlyContinue | Select-Object -First 1),
            (Get-ChildItem "$root\nsis" -Filter *.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1)
          )
          if ($wanted -contains $null) { Write-Error "missing a Windows artifact (.msi / .exe / .exe.sig)" }
          $wanted | ForEach-Object { Copy-Item $_.FullName dist\ }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish — one release, every installer, plus the updater manifest.
  # ---------------------------------------------------------------------------
  release:
    needs: [macos, windows]
    # `always()` so a release still goes out when one platform fails: half an
    # update beats none, and the manifest below simply omits that platform.
    if: always()
    runs-on: [self-hosted, macos-local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build latest.json and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"

          # Patch notes come from the in-app changelog — one source of truth, so
          # what the release page says and what the app shows cannot drift.
          NOTES="$(node "$DESKTOP_DIR/scripts/release-notes.mjs" "$VERSION")" \
            || NOTES="Accord desktop $GITHUB_REF_NAME"

          cd artifacts
          platforms='{}'
          mac_tar="$(ls *.app.tar.gz 2>/dev/null | head -1 || true)"
          win_exe="$(ls *-setup.exe 2>/dev/null | head -1 || true)"
          [ -n "$win_exe" ] || win_exe="$(ls *.exe 2>/dev/null | grep -v '\.sig$' | head -1 || true)"

          # A platform enters the manifest only WITH its signature: an entry
          # without one makes the updater reject the download at install time,
          # which looks like a broken app rather than a missing signature.
          if [ -n "$mac_tar" ] && [ -f "$mac_tar.sig" ]; then
            platforms="$(jq -c --arg url "$BASE/$mac_tar" --arg sig "$(cat "$mac_tar.sig")" \
              '. + {"darwin-universal": {url: $url, signature: $sig}}' <<<"$platforms")"
          fi
          if [ -n "$win_exe" ] && [ -f "$win_exe.sig" ]; then
            platforms="$(jq -c --arg url "$BASE/$win_exe" --arg sig "$(cat "$win_exe.sig")" \
              '. + {"windows-x86_64": {url: $url, signature: $sig}}' <<<"$platforms")"
          fi

          if [ "$(jq 'length' <<<"$platforms")" -gt 0 ]; then
            jq -n --arg version "$VERSION" --arg notes "$NOTES" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson platforms "$platforms" \
              '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
              > latest.json
            echo "manifest covers: $(jq -r '.platforms | keys | join(", ")' latest.json)"
          else
            echo "WARNING: no signed updater artifact — publishing installers only."
            echo "Installed clients will NOT see this version."
          fi

          # The .sig files are build inputs, not downloads: their content is
          # already inside latest.json.
          rm -f ./*.sig

          gh release create "$GITHUB_REF_NAME" \
            --repo "$REPO" \
            --title "Accord $GITHUB_REF_NAME" \
            --notes "$(printf '%s\n\n%s\n\nDownload an installer below. On first launch you will be asked for your Accord server address.' "Accord desktop $GITHUB_REF_NAME." "$NOTES")" \
            ./*
