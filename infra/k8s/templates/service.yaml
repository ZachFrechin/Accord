# ============================================================================
# Service ClusterIP exposant les replicas du backend derriere une VIP stable.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "accord-backend.fullname" . }}
  labels:
    {{- include "accord-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "accord-backend.selectorLabels" . | nindent 4 }}
