# ============================================================================
# Deployment du backend Accord2 — STATELESS, >1 replica.
# Points cles Phase 0:
#   - pas d'etat local (aucun volume) => scalable a plat.
#   - sondes liveness/readiness cablees sur /health/live et /health/ready.
#   - arret gracieux: k8s envoie SIGTERM, shutdown.rs draine puis quitte.
#   - config non-secrete via env ; secrets via Secret k8s reference.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accord-backend.fullname" . }}
  labels:
    {{- include "accord-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Si le HPA est actif, on ne fige PAS replicas (le HPA en est proprietaire).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "accord-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "accord-backend.selectorLabels" . | nindent 8 }}
      annotations:
        # Expose /metrics au scrape Prometheus.
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.config.SERVER__PORT }}"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Laisse le temps a shutdown.rs de drainer les connexions sur SIGTERM.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: accord-backend
          image: "{{ .Values.image.repository }}:{{ include "accord-backend.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.SERVER__PORT }}
          # --- Config non-secrete ---------------------------------------
          env:
            {{- range $key, $val := .Values.config }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          # --- Secrets (DATABASE__URL, etc.) depuis un Secret existant ---
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          # --- Sondes ---------------------------------------------------
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Durcissement: rootfs en lecture seule, pas de privilege eleve.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
