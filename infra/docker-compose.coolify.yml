# ============================================================================
# Accord2 — Coolify deployment. Everything is bundled (Postgres, Redis, NATS,
# MinIO, LiveKit, Mailpit + the backend). You set NOTHING by hand: Coolify's
# "magic" env vars generate every secret once and reuse it across services, and
# SERVICE_FQDN_<svc>_<port> auto-creates the reverse-proxy route (no Traefik
# labels). Just point Coolify at this file and deploy.
#
# The only prerequisite is a wildcard domain configured on the Coolify server
# (Settings -> Domains). Each public service then gets its own auto-subdomain,
# which you can rename in Coolify's "Domains" tab per service.
#
# To use a prebuilt image instead of building from the repo, replace the two
# `build:` blocks with `image: <your-registry>/accord-backend:tag`.
# ============================================================================

services:
  # ---- internal datastores (no ports, no domain: private network only) -------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=accord
      - POSTGRES_DB=accord
      # SERVICE_PASSWORD_DB is generated by Coolify and reused wherever it's
      # referenced below (same value everywhere).
      - SERVICE_PASSWORD_DB
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d accord"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- object storage: S3 API published on its own subdomain ------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=accord
      - SERVICE_PASSWORD_MINIO
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      # Publish the S3 API (port 9000) on an auto-subdomain — clients fetch
      # avatars and (presigned) attachments here. The console (9001) stays private.
      - SERVICE_FQDN_MINIO_9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the buckets, make avatars publicly readable, then exit.
  createbuckets:
    image: minio/mc:latest
    restart: "no"
    exclude_from_hc: true # one-shot: don't drag down Coolify's health rollup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - SERVICE_PASSWORD_MINIO
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://minio:9000 accord ${SERVICE_PASSWORD_MINIO} &&
      mc mb --ignore-existing s3/accord-attachments &&
      mc mb --ignore-existing s3/accord-avatars &&
      mc anonymous set download s3/accord-avatars &&
      echo 'buckets ready'
      "

  # ---- transactional-email sink: read verification/reset mail in its UI -------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Publish only the web UI (8025). SMTP (1025) stays on the private network.
      - SERVICE_FQDN_MAILPIT_8025

  # ---- SFU for audio/video calls ---------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      - SERVICE_USER_LIVEKIT
      - SERVICE_PASSWORD_64_LIVEKIT
      # key: secret — must match LIVEKIT__API_KEY / LIVEKIT__API_SECRET on backend.
      # Quoted: the "key: secret" colon would otherwise be parsed as a nested YAML map.
      - "LIVEKIT_KEYS=${SERVICE_USER_LIVEKIT}: ${SERVICE_PASSWORD_64_LIVEKIT}"
      # WebSocket signaling on its own subdomain (media uses the UDP port below).
      - SERVICE_FQDN_LIVEKIT_7880
    volumes:
      # Coolify materializes this file from `content:` — no repo file needed.
      - type: bind
        source: ./livekit.coolify.yaml
        target: /etc/livekit.yaml
        content: |
          port: 7880
          rtc:
            tcp_port: 7881
            udp_port: 7882
            # Remote host reachable over the internet: advertise the public IP for
            # media. Requires UDP 7882 (and TCP 7881) open on the server firewall.
            use_external_ip: true
          logging:
            level: info
            json: false
    ports:
      # Media (RTP/RTCP) can't traverse the HTTP proxy — publish it on the host.
      - "7881:7881"
      - "7882:7882/udp"

  # ---- schema migration: runs once, then exits --------------------------------
  migrate:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    image: accord-backend:latest
    command: ["migrate"]
    restart: "no"
    exclude_from_hc: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_PASSWORD_DB
      - DATABASE__URL=postgres://accord:${SERVICE_PASSWORD_DB}@postgres:5432/accord

  # ---- the backend: API + realtime, published on its own subdomain ------------
  backend:
    image: accord-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # -- public routing (auto-proxied to container port 8090) --
      - SERVICE_FQDN_BACKEND_8090
      - SERVER__HOST=0.0.0.0
      - SERVER__PORT=8090
      - SERVER__PUBLIC_URL=${SERVICE_URL_BACKEND_8090}
      # Desktop webview origins (per-OS: tauri://localhost on macOS/Linux,
      # http(s)://tauri.localhost on Windows/WebView2). Add web client origin(s) too.
      - SERVER__CORS_ALLOWED_ORIGINS=${SERVER__CORS_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      # Refuse to boot on any leftover dev-default secret (all are generated below).
      - SERVER__PRODUCTION=true

      # -- datastores (private service names) --
      - SERVICE_PASSWORD_DB
      - DATABASE__URL=postgres://accord:${SERVICE_PASSWORD_DB}@postgres:5432/accord
      - REDIS__URL=redis://redis:6379
      - NATS__URL=nats://nats:4222

      # -- object storage: sign against the public subdomain so the client's Host
      #    matches the signature; talk to MinIO internally for nothing else. --
      - SERVICE_PASSWORD_MINIO
      - STORAGE__ENDPOINT=http://minio:9000
      - STORAGE__PUBLIC_ENDPOINT=${SERVICE_URL_MINIO_9000}
      - STORAGE__REGION=us-east-1
      - STORAGE__BUCKET=accord-attachments
      - STORAGE__AVATARS_BUCKET=accord-avatars
      - STORAGE__ACCESS_KEY=accord
      - STORAGE__SECRET_KEY=${SERVICE_PASSWORD_MINIO}

      # -- calls: same key/secret as the livekit service; wss on its subdomain --
      - SERVICE_USER_LIVEKIT
      - SERVICE_PASSWORD_64_LIVEKIT
      - LIVEKIT__URL=wss://${SERVICE_FQDN_LIVEKIT_7880}
      - LIVEKIT__API_KEY=${SERVICE_USER_LIVEKIT}
      - LIVEKIT__API_SECRET=${SERVICE_PASSWORD_64_LIVEKIT}

      # -- 2FA sealing key (any strong string; hashed to 32 bytes internally) --
      - SERVICE_PASSWORD_64_TOTP
      - AUTH__TOTP_ENC_KEY=${SERVICE_PASSWORD_64_TOTP}

      # -- JWT signing: a random secret is fine — the backend derives a stable
      #    Ed25519 key from it (no key-generation tooling needed). --
      - SERVICE_PASSWORD_64_JWT
      - JWT__PRIVATE_KEY_PEM=${SERVICE_PASSWORD_64_JWT}

      # -- e-mail: the bundled Mailpit sink by default. Point at a real SMTP
      #    provider (e.g. smtps://user:pass@host:465) for real delivery. --
      - EMAIL__SMTP_URL=${EMAIL__SMTP_URL:-smtp://mailpit:1025}
      - EMAIL__FROM=${EMAIL__FROM:-Accord <no-reply@accord.local>}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pg-data:
  redis-data:
  nats-data:
  minio-data:
