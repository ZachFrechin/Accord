# ============================================================================
# OpenTelemetry Collector — pipeline unique de telemetrie Accord2 (DEV).
#
# Le backend (accord-backend) exporte tout en OTLP/gRPC vers :4317.
# Le collector separe ensuite les signaux:
#   - traces  -> Tempo (OTLP)
#   - metrics -> exporter Prometheus (scrape par Prometheus sur :8889)
#   - logs    -> Loki (OTLP HTTP)
# ============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Regroupe les spans/metrics/logs en lots pour limiter les appels reseau.
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Garde-fou memoire: previent l'OOM du collector sous forte charge.
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # --- Traces -> Tempo (OTLP gRPC natif, sans TLS en dev) -------------------
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # --- Metrics -> endpoint scrape par Prometheus ---------------------------
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # --- Logs -> Loki via OTLP HTTP ------------------------------------------
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Utile pour debug local: decommenter pour voir la telemetrie en console.
  # debug:
  #   verbosity: detailed

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
