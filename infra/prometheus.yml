# ============================================================================
# Prometheus — scrape config Accord2 (DEV).
#   - self: metriques internes de Prometheus.
#   - otel-collector: metriques de l'app remontees via OTLP puis exposees
#     par l'exporter Prometheus du collector (:8889).
#   - backend: endpoint /metrics du backend qui tourne sur l'hote (cargo run).
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: accord2-dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metriques applicatives remontees via OTLP -> collector -> exporter Prom.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Endpoint /metrics du backend lance en local via `cargo run`.
  # host.docker.internal est mappe sur host-gateway dans le compose.
  - job_name: accord-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
