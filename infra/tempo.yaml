# ============================================================================
# Tempo — backend de traces (DEV, stockage local mono-noeud).
# Recoit les traces du collector en OTLP gRPC (:4317 interne au conteneur),
# expose son API HTTP sur :3200 (interrogee par Grafana).
# ============================================================================

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h   # DEV: retention courte

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Genere des metriques RED (Request/Error/Duration) a partir des spans et les
# pousse vers Prometheus via remote-write.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
